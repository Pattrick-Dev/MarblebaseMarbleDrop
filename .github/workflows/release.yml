name: Release

# Builds the plugin and publishes a GitHub Release (with the jar attached)
# on every push to main that actually touches the plugin's code - this is
# what me.pattrick.marbledrop.update.UpdateChecker polls to auto-update the
# server. Version is auto-derived (1.0.<run number>) - no manual tagging.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set release version
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          # Only the project's own <version> (the first one in pom.xml) -
          # dependency <version> tags further down must not be touched.
          sed -i "0,/<version>.*<\/version>/s//<version>${VERSION}<\/version>/" pom.xml
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B clean package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: target/MarblebaseDrop.jar
          generate_release_notes: true
