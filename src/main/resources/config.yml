      TURTLE_HELMET: 6

      # ---- Other gear & utility items ----
      SHIELD: 2
      BOW: 2
      CROSSBOW: 3
      TRIDENT: 20
      ELYTRA: 60
      FISHING_ROD: 1
      FLINT_AND_STEEL: 1
      SHEARS: 1
