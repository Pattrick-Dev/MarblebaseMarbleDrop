      NETHERITE_SWORD: 45
      NETHERITE_PICKAXE: 50
      NETHERITE_AXE: 50
      NETHERITE_SHOVEL: 40
      NETHERITE_HOE: 40
      NETHERITE_HELMET: 45
      NETHERITE_CHESTPLATE: 60
      NETHERITE_LEGGINGS: 55
      NETHERITE_BOOTS: 40

      LEATHER_HELMET: 1
      LEATHER_CHESTPLATE: 2
      LEATHER_LEGGINGS: 1.5
      LEATHER_BOOTS: 1

      CHAINMAIL_HELMET: 5
      CHAINMAIL_CHESTPLATE: 7
      CHAINMAIL_LEGGINGS: 6
