debug:
  enabled: false

update-checker:
  enabled: true               # check GitHub Releases for a newer build than this one, and stage it for the next restart
  check-interval-hours: 6     # how often to check
  notify-ops: true            # tell online ops in chat once an update has been downloaded and staged

discord:
  webhook-url: ""             # paste a Discord channel webhook URL here to enable scheduled-race status posts; blank = disabled
  update-interval-seconds: 20 # how often the countdown message is edited while a race is open (keep this reasonable - Discord will rate-limit edits that are too frequent)

holograms:
  name-visible-radius: 8.0

  infusion:
    name: "&5✦ &dInfusion Cauldron &5✦"
    y-offset: 1.25

  recycler:
    name: "&8✦ &6Marble Recycler &8✦"
    y-offset: 1.15

  upgrade:
    name: "&b✦ &dUpgrade Station &b✦"
    y-offset: 1.2

infusion:
  daily-cap: 5   # 0 = unlimited

  animation:
    total-ticks: 120
    hold-ticks: 20
    reveal-early-ticks: 10

    bob:
      amplitude: 0.10
      speed: 0.22

    spin:
      starting-turns: 7.0

  catalyst:
    # Fallback per-item value for any material with no entry in `values`
    # below (e.g. wood) - deliberately low enough that even a full 64
    # stack (64 x 1 = 64) can't reach the cap, so junk/infinite materials
    # can never meaningfully buy odds no matter how much you stack.
    default-per-item: 1

    # Only crafting materials can be used as catalysts - marbles cannot
    # (see CatalystProfile). Value is per single item and the WHOLE stack
    # placed in the slot is consumed and its value summed (perItem x
    # amount) - see CatalystProfile#of. That total is hard-capped at
    # CatalystProfile.MAX_RARITY_VALUE (150), and InfusionTableListener
    # refuses to let a stack worth more than the cap sit in the slot at
    # all. Values are tiered by how hard the item is to get, in decimal
    # steps so junk stays clearly below anything that matters:
    #   junk        0.05 - 0.5   (terrain, saplings, common drops)
    #   common       1   - 3     (basic ores/food/drops, wood/stone gear)
    #   uncommon     4   - 8     (iron/gold tier, mid nether/ocean drops)
    #   rare        10   - 20    (diamond/emerald tier, top mob drops)
    #   very rare   30   - 75    (compact rare blocks, netherite gear)
    #   Netherite Block alone hits the cap (150) - it's the one item
    #   that can single-handedly max this out.
    # Anything not listed here falls back to default-per-item above, so
    # every material still has a value - it's just deliberately tiny.
    values:
      # ---- Terrain & building blocks ----
      DIRT: 0.1
      GRASS_BLOCK: 0.1
      COARSE_DIRT: 0.1
      PODZOL: 0.1
      MYCELIUM: 0.2
      ROOTED_DIRT: 0.1
      MUD: 0.1
      SAND: 0.1
      RED_SAND: 0.1
      GRAVEL: 0.1
      COBBLESTONE: 0.1
      STONE: 0.1
      ANDESITE: 0.1
      DIORITE: 0.1
      GRANITE: 0.1
      DEEPSLATE: 0.1
      COBBLED_DEEPSLATE: 0.1
      TUFF: 0.1
      CALCITE: 0.2
      DRIPSTONE_BLOCK: 0.2
      NETHERRACK: 0.1
      SOUL_SAND: 0.2
      SOUL_SOIL: 0.2
      BASALT: 0.2
      BLACKSTONE: 0.2
      END_STONE: 0.3
      CLAY: 0.3
      CLAY_BALL: 0.2
      ICE: 0.2
      PACKED_ICE: 0.4
      BLUE_ICE: 0.5
      SNOW_BLOCK: 0.1
      SNOWBALL: 0.1
      MOSS_BLOCK: 0.3
      GLASS: 0.2
      SANDSTONE: 0.2
      RED_SANDSTONE: 0.2
      OBSIDIAN: 1.5
      CRYING_OBSIDIAN: 3

      # ---- Logs & wood ----
      OAK_LOG: 0.2
      SPRUCE_LOG: 0.2
      BIRCH_LOG: 0.2
      JUNGLE_LOG: 0.2
      ACACIA_LOG: 0.2
      DARK_OAK_LOG: 0.2
      MANGROVE_LOG: 0.2
      CHERRY_LOG: 0.2
      CRIMSON_STEM: 0.3
      WARPED_STEM: 0.3
      BAMBOO_BLOCK: 0.2
      STICK: 0.1

      # ---- Plants, seeds & farming ----
      WHEAT_SEEDS: 0.1
      BEETROOT_SEEDS: 0.1
      MELON_SEEDS: 0.1
      PUMPKIN_SEEDS: 0.1
      OAK_SAPLING: 0.1
      SPRUCE_SAPLING: 0.1
      BIRCH_SAPLING: 0.1
      JUNGLE_SAPLING: 0.1
      ACACIA_SAPLING: 0.1
      DARK_OAK_SAPLING: 0.1
      MANGROVE_PROPAGULE: 0.1
      CHERRY_SAPLING: 0.1
      SUGAR_CANE: 0.2
      BAMBOO: 0.1
      KELP: 0.1
      SEAGRASS: 0.1
      VINE: 0.1
      LILY_PAD: 0.2
      CACTUS: 0.2
      NETHER_WART: 0.5
      CHORUS_FRUIT: 0.5
      POPPED_CHORUS_FRUIT: 0.5
      SWEET_BERRIES: 0.2
      GLOW_BERRIES: 0.3
