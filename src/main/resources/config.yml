      DIAMOND_AXE: 16
      DIAMOND_SHOVEL: 12
      DIAMOND_HOE: 12
      DIAMOND_HELMET: 14
      DIAMOND_CHESTPLATE: 20
      DIAMOND_LEGGINGS: 18
