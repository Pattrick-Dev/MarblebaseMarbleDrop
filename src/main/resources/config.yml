debug:
  enabled: false

update-checker:
  enabled: true               # check GitHub Releases for a newer build than this one, and stage it for the next restart
  check-interval-hours: 6     # how often to check
  notify-ops: true            # tell online ops in chat once an update has been downloaded and staged

discord:
  webhook-url: ""             # paste a Discord channel webhook URL here to enable scheduled-race status posts; blank = disabled
  update-interval-seconds: 20 # how often the countdown message is edited while a race is open (keep this reasonable - Discord will rate-limit edits that are too frequent)

holograms:
  name-visible-radius: 8.0

  infusion:
    name: "&5✦ &dInfusion Cauldron &5✦"
    y-offset: 1.25

  recycler:
    name: "&8✦ &6Marble Recycler &8✦"
    y-offset: 1.15

  upgrade:
    name: "&b✦ &dUpgrade Station &b✦"
    y-offset: 1.2

infusion:
  daily-cap: 5   # 0 = unlimited

  animation:
    total-ticks: 120
    hold-ticks: 20
    reveal-early-ticks: 10

    bob:
      amplitude: 0.10
      speed: 0.22

    spin:
      starting-turns: 7.0

  catalyst:
    default-per-item: 10

    # Only crafting materials can be used as catalysts - marbles cannot
    # (see CatalystProfile). Every value below is per single item (only 1
    # is ever consumed per infusion, regardless of stack size) and is
    # additionally hard-capped at CatalystProfile.MAX_RARITY_VALUE (150) -
    # a catalyst can meaningfully nudge an infusion, but never buy the
    # top rarity band outright the way materials used to when this table
    # went as high as 7200.
    values:
      DIAMOND: 40
      DIAMOND_BLOCK: 140      # = 9 diamonds
      EMERALD: 35
      EMERALD_BLOCK: 125      # = 9 emeralds
      NETHERITE_INGOT: 100
      NETHERITE_BLOCK: 150    # = 9 netherite ingots (capped)
      NETHERITE_SCRAP: 55
      GOLD_INGOT: 20
      GOLD_BLOCK: 75          # = 9 gold ingots
      IRON_INGOT: 15
      IRON_BLOCK: 60          # = 9 iron ingots
      AMETHYST_SHARD: 18
      PRISMARINE_CRYSTALS: 16
      BLAZE_ROD: 20
      ENDER_PEARL: 18
      SHULKER_SHELL: 65

    # Material catalysts give a higher chance (never a guarantee) of
    # rolling higher on the listed stats - see StatRoller. Materials left
    # out here (DIAMOND, EMERALD, NETHERITE_*, etc.) still work as pure
    # rarity-value catalysts with no stat skew.
    stat-affinity:
      BLAZE_ROD: [BOOST]
      ENDER_PEARL: [HANDLING]
      PRISMARINE_CRYSTALS: [STABILITY]
      AMETHYST_SHARD: [ACCEL]
      IRON_INGOT: [SPEED]

upgrade-station:
  gui:
    show-cap: true
    show-cost: true
    click-to-upgrade-text: "&aClick to upgrade"

  cost:
    base: 10
    per-point: 0.12
    rarity-multiplier:
      COMMON: 1.0
      UNCOMMON: 1.1
      RARE: 1.25
      EPIC: 1.5
      LEGENDARY: 2.0

  daily-cap: 0  # 0 = unlimited

races:
  wall-search-radius: 2.5  # blocks from the track's centerline to scan for solid blocks when measuring the starting grid's width

  scheduled:
    enabled: true
    announce-minutes-before: [10, 5, 1] # reminder broadcasts before the race starts
    winner-dust: 50                    # base dust for 1st place against real players
    winner-dust-vs-ai: 15               # base dust for 1st place when AI had to fill in the lobby
    place-dust-percentages: [100, 50, 25] # percent of the base dust each finish place earns (index 0 = 1st); places beyond this list earn nothing
    ai-fill-count: 3                   # AI opponents added when exactly 1 real player joins
    ai-show-count: 4                   # AI racers for a pure showcase race when no one joins

    # The ONLY times a race actually runs (24h HH:mm, server's local time).
    # Entry is always open - the moment one race ends (or the plugin
    # starts), the next one opens immediately and stays joinable right up
    # until the next one of these times, then closes and runs. If no
    # eligible track happens to be free right then, it keeps retrying every
    # few seconds until one opens up. Empty list, or `enabled: false` above,
    # turns scheduled races off entirely - re-enabling requires
    # /md race forcecycle or a restart to kick it back off.
    daily-times: ["12:00", "16:00", "20:00", "00:00"]

recycler:
  dust-return:
    COMMON: 5
    UNCOMMON: 10
    RARE: 20
    EPIC: 40
    LEGENDARY: 80
